name = "synapse"
description = "Synapse: persistent vault and code-graph memory for coding agents"
version = "0.0.0-dev"

authors = ["Ivica Munitic"]
maintainers = ["Ivica Munitic <imunitic@gmail.com>"]
maintainers-logins = []
licenses = "MIT"
tags = []

executables = ["synapse", "synapse-hook", "synapse-fake"]

[build-switches]
validation.contracts = "Yes"
validation.style_checks = "Yes"
validation.compile_checks = "Warnings"
"*".ada_version = "Ada2022"

[gpr-set-externals.'case(os)']
windows = { SYNAPSE_OS = "windows" }
'...' = { SYNAPSE_OS = "posix" }
