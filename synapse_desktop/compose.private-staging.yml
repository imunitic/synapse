# Private staging only. Supply external configuration and unique tokens.
# No service publishes a public port. The gateway is reachable on host loopback.
services:
  gateway:
    build:
      context: ..
      dockerfile: synapse_desktop/Dockerfile.private-gateway
    environment:
      SYNAPSE_PRIVATE_GATEWAY_CONTAINER_BIND: '1'
      SYNAPSE_PRIVATE_GATEWAY_CONFIG: /run/secrets/gateway.json
    volumes:
      - ${SYNAPSE_GATEWAY_CONFIG:?required}:/run/secrets/gateway.json:ro
    ports:
      - '127.0.0.1:5180:5180'
    networks:
      user_a:
        ipv4_address: 172.29.101.3
      user_b:
        ipv4_address: 172.29.102.3
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  backend_a:
    build:
      context: ..
      dockerfile: synapse_desktop/Dockerfile.private-host
    environment:
      SYNAPSE_DESKTOP_PRIVATE_BIND_ADDRESS: 172.29.101.2
      SYNAPSE_DESKTOP_TOKEN: ${SYNAPSE_BACKEND_A_TOKEN:?required}
      SYNAPSE_DESKTOP_PRIVATE_BACKEND_ORIGIN: http://gateway.internal
    networks:
      user_a:
        ipv4_address: 172.29.101.2
    volumes:
      - home_a:/home/node
    mem_limit: 2g
    cpus: 1.0
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  backend_b:
    build:
      context: ..
      dockerfile: synapse_desktop/Dockerfile.private-host
    environment:
      SYNAPSE_DESKTOP_PRIVATE_BIND_ADDRESS: 172.29.102.2
      SYNAPSE_DESKTOP_TOKEN: ${SYNAPSE_BACKEND_B_TOKEN:?required}
      SYNAPSE_DESKTOP_PRIVATE_BACKEND_ORIGIN: http://gateway.internal
    networks:
      user_b:
        ipv4_address: 172.29.102.2
    volumes:
      - home_b:/home/node
    mem_limit: 2g
    cpus: 1.0
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
networks:
  user_a:
    ipam:
      config:
        - subnet: 172.29.101.0/24
  user_b:
    ipam:
      config:
        - subnet: 172.29.102.0/24
volumes:
  home_a:
  home_b:
