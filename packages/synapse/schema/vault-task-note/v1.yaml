# Declared keys are the full v1 spec; enforcement is a deliberate subset — unknown note fields are ignored, never an error.
schema: synapse-note-schema/v1
id: vault-task-note/v1

frontmatter:
  fields:
    schema:
      type: string
      required: true
      const: vault-task-note/v1
    title:
      type: string
      required: true
      min_length: 1
    project:
      type: string
      required: true
      min_length: 1
    task_id:
      type: string
      required: true
      pattern: '^[a-z][a-z0-9-]*-[0-9]{3,}$'
      mutable: false
    created:
      type: timestamp
      required: true
      format: 'YYYY-MM-DDTHH:MM:SSZ07:00'
      timezone: local
      mutable: false
    updated:
      type: timestamp
      required: true
      format: 'YYYY-MM-DDTHH:MM:SSZ07:00'
      timezone: local
      update_on: [vault-write, vault-patch]
    tags:
      type: list
      required: true
      items: string
    status:
      type: string
      required: true
      enum: [TODO, IN-PROGRESS, REVIEW, DONE, CANCELED]

body:
  h1:
    required: true
    count: 1
    equals: frontmatter.title
  preamble:
    - type: blockquote
      required: false
      position: immediately_after_h1
      marker: '> Design note:'
      pattern: '^> Design note: \[\[[^\]]+\]\]$'
  lead:
    type: prose
    required: true
    position: before_sections
  checklist:
    required: true
    min_items: 1
    position: before_sections
    nested_items: false
    allowed_children: [paragraph, fenced_code]
  sections:
    - title: Checklist
      level: 2
      required: true
    - title: Notes
      level: 2
      required: false
      max_occurs: 1
      children:
        - level: 3
          required: false
          repeatable: true
          title_pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2} — .+$'
  section_order: relative

checks:
  - eq:
      - var: filename.stem
      - var: frontmatter.title
    message: 'filename.stem: must equal frontmatter.title'
  - on_create:
      var: id_is_unique
    message: 'frontmatter.task_id: identity already exists'
  - in:
      - var: frontmatter.project
      - var: vocabularies.synapse-projects
    message: 'frontmatter.project: not in synapse-projects.conf'
  - all:
      - var: frontmatter.tags
      - in:
          - var: ''
          - var: vocabularies.synapse-tag-vocabulary
    message: 'frontmatter.tags: every tag must be in synapse-tag-vocabulary.conf'
  - lte:
      - var: created_epoch
      - var: updated_epoch
    message: 'frontmatter.updated: must not precede frontmatter.created'
  - on_create:
      eq:
        - var: created_epoch
        - var: updated_epoch
    message: 'frontmatter.created: must equal frontmatter.updated on creation'
  - on_create:
      eq:
        - var: frontmatter.status
        - TODO
    message: 'frontmatter.status: must equal TODO on creation'

lints:
  - no_hard_wrap:
      var: body.prose
    severity: warn
  - not:
      starts_with:
        - var: frontmatter.title
        - var: frontmatter.task_id
    severity: warn
