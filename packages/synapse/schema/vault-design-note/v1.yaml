# Declared keys are the full v1 spec; enforcement is a deliberate subset — unknown note fields are ignored, never an error.
schema: synapse-note-schema/v1
id: vault-design-note/v1

frontmatter:
  fields:
    schema:
      type: string
      required: true
      const: vault-design-note/v1
    title:
      type: string
      required: true
      min_length: 1
    project:
      type: string
      required: true
      min_length: 1
    note_id:
      type: string
      required: true
      pattern: '^[a-z][a-z0-9-]*-[0-9]{3,}$'
      mutable: false
    created:
      type: timestamp
      required: true
      format: 'YYYY-MM-DDTHH:MM:SSZ07:00'
      timezone: local
      mutable: false
    updated:
      type: timestamp
      required: true
      format: 'YYYY-MM-DDTHH:MM:SSZ07:00'
      timezone: local
      update_on: [vault-write, vault-patch]
    tags:
      type: list
      required: true
      items: string

body:
  h1:
    required: true
    count: 1
    equals: frontmatter.title
  preamble:
    - type: blockquote
      required: false
      position: immediately_after_h1
      pattern: '^> Compiled task: \[\[[^\]]+\]\]$'
  sections:
    - title: Status
      level: 2
      required: true
      content:
        type: string
        enum: [Discussing, Ready, Reference]
    - title: Problem
      level: 2
      required: true
      non_empty: true
    - title: Approach
      level: 2
      required: true
      non_empty: true
      children:
        - title: Alternatives considered
          level: 3
          required: false
          non_empty: true
    - title: Constraints
      level: 2
      required: true
      non_empty: true
    - title: Open Questions
      level: 2
      required: false
      non_empty: true
  section_order: relative

checks:
  - eq:
      - var: filename.stem
      - var: frontmatter.title
    message: 'filename.stem: must equal frontmatter.title'
  - on_create:
      var: id_is_unique
    message: 'frontmatter.note_id: identity already exists'
  - in:
      - var: frontmatter.project
      - var: vocabularies.synapse-projects
    message: 'frontmatter.project: not in synapse-projects.conf'
  - all:
      - var: frontmatter.tags
      - in:
          - var: ''
          - var: vocabularies.synapse-tag-vocabulary
    message: 'frontmatter.tags: every tag must be in synapse-tag-vocabulary.conf'
  - lte:
      - var: created_epoch
      - var: updated_epoch
    message: 'frontmatter.updated: must not precede frontmatter.created'
  - on_create:
      eq:
        - var: created_epoch
        - var: updated_epoch
    message: 'frontmatter.created: must equal frontmatter.updated on creation'

lints:
  - no_hard_wrap:
      var: body.prose
    severity: warn
  - no_id_prefix_in_title:
      - var: frontmatter.title
      - var: frontmatter.note_id
    severity: warn
