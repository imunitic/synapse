name: tests

# Every push and pull request. Needs no secrets: git is stubbed by
# tests/acceptance/fixtures/fake-bin/git, and tree-sitter with its grammar
# cloning by the program `synapse-fake`, so nothing here touches a network
# (beyond fetching the toolchain and the pinned test data), a real vault or a
# real ~/.claude. The steps are the ones `just check` runs.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Builds the programs, runs the AUnit suite with contracts checked at run
  # time and proves the SPARK units, on the platforms that have a release, then
  # checks the generated Unicode tables are current. Windows joins the matrix
  # when its port passes the suite.
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      # Installs Alire and its default toolchain (gnat_native, gprbuild); the
      # crate's own dependencies (AUnit, GNATprove) are fetched on first build.
      - uses: alire-project/setup-alire@v6

      # The justfile owns every command and the pinned Unicode version, so this
      # workflow and a local `just check` cannot drift apart.
      - uses: extractions/setup-just@v4

      - name: Build
        run: just build

      - name: AUnit tests
        run: just test

      - name: GNATprove
        run: just prove

      - name: Generated Unicode tables are current
        run: just gen-check

  # The subprocess suite and the doc checks, against the built programs. Linux
  # only: the two shells disagree in ways that pass silently on one of them
  # (BSD vs GNU `sed -i`, macOS `mktemp` ignoring TMPDIR without a template),
  # and macOS is covered by development itself. If a macOS-only regression
  # starts landing, add macos-latest here as a matrix entry.
  acceptance:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: alire-project/setup-alire@v6
      - uses: extractions/setup-just@v4

      # No version pinned: the action resolves it from `build.zig.zon`'s
      # `minimum_zig_version`, so the pin lives in one place. Zig only runs
      # the acceptance and lint suites.
      - uses: mlugg/setup-zig@v2

      # Several tests commit to a scratch repo, and a runner has no global
      # identity.
      - name: Configure git identity for scratch repos
        run: |
          git config --global user.email ci@example.com
          git config --global user.name CI

      - name: Build
        run: just build

      - name: Subprocess suite
        run: just acceptance

      - name: Doc and text checks
        run: just lint

      # Both generated artefacts are also verified inside the suite, by their
      # own --check mode; repeated so a failure names itself in the log.
      - name: Generated docs are in sync
        if: always()
        run: ./docs/synapse/generate-cli-reference.sh --check

      - name: Rendered diagrams are in sync
        if: always()
        run: ./docs/synapse/generate-diagrams.sh --check

      - name: npm package includes every shipped schema document
        if: always()
        run: just npm-check

  # The release binaries packaged as the npm packages and installed the way a
  # user does (`ci/package.sh`): the shims, `synapse-setup configure` for each
  # harness and the installed hooks. The platforms that have an npm package;
  # Windows has none yet.
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5
      - uses: alire-project/setup-alire@v6
      - uses: extractions/setup-just@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Package and check the installed program
        run: just package
