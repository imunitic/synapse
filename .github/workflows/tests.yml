name: tests

# Every push and pull request. The suite is fast (a couple of minutes) and needs
# no secrets: the Obsidian Local REST API is stubbed by tests/fixtures/fake-bin/curl,
# tree-sitter and its grammar cloning by the fake tree-sitter and git in the same
# folder, so nothing here touches a network, a real vault, or a real ~/.claude.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # A separate job rather than steps bolted onto `bats`: the two fail for
  # unrelated reasons and neither orders the other, so running them in parallel
  # costs nothing and keeps a red X pointing at the half that actually broke.
  zig:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # No version pinned here on purpose. The action resolves it from
      # `build.zig.zon`'s `minimum_zig_version`, so the pin lives in exactly one
      # place and CI cannot quietly build with a different toolchain than a
      # local `zig build` uses. Pinning it here too would be a second copy of a
      # number, which is a second copy that goes stale.
      #
      # cache-size-limit raised from the 2048 MiB default: this job's own
      # .zig-cache (native build + test, sharing one cache scope) measured
      # comfortably inside 2048 on a normal run, but the bats job below
      # measured 1.9 GB on the same push, close enough to that default limit
      # that a routine size increase would start silently skipping the cache
      # save.
      - uses: mlugg/setup-zig@v2
        with:
          cache-size-limit: 4096

      - name: Show version
        run: zig version

      - name: Build
        run: zig build

      # Internals only -- format round-trips, parsing, the process helper. The
      # CLI contract belongs to the bats job, and duplicating it here would
      # retire that suite as the specification without anyone deciding to.
      - name: Unit tests
        run: zig build test --summary all

      # The half of the layering the compiler cannot enforce: Zig analyses
      # declarations lazily, so a wrong-direction import nothing references
      # compiles silently.
      - name: Layering and purity
        run: ./ci/check-layering.sh

  # A separate matrix job, not a step in `zig` above: Zig's own cache is keyed
  # per target triple, so three different targets sharing one job's cache
  # scope never reuse each other's compiled objects regardless of cache size
  # -- see the vault research note "CI cross-compile caching doesn't help
  # across target triples". Splitting into one job per target trades that
  # unavoidable compute cost for wall-clock: the three builds don't depend on
  # each other, so running them in parallel cuts this from ~11 minutes
  # (sequential) to whichever single target is slowest (~4 minutes). Main
  # only -- a portability break is real work either way, but a feature branch
  # already gets it from the `zig` job's own `Build` step failing outright on
  # its own host target; the other two platforms only need checking before
  # the merge that actually ships them.
  cross-compile:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-linux, aarch64-linux, aarch64-macos]
    steps:
      - uses: actions/checkout@v5

      # `cache-key` scopes the Zig cache per matrix instance -- the action's
      # own default key varies by runner OS, not by `matrix.target`, so
      # without this all three parallel jobs race to save under the
      # identical key and only the fastest one's cache actually persists;
      # the other two always cold-start their compiled-object cache.
      - uses: mlugg/setup-zig@v2
        with:
          cache-size-limit: 4096
          cache-key: ${{ matrix.target }}

      # Same script `just build-targets` runs (with no argument, sequentially,
      # for a local full check) -- one definition rather than one here and one
      # in the justfile.
      - name: Cross-compile ${{ matrix.target }}
        run: ./ci/build-targets.sh ${{ matrix.target }}

  bats:
    # Linux only, and the asymmetry is the point rather than an economy. The two
    # shells disagree in ways that pass silently on one of them -- BSD vs GNU
    # `sed -i`, macOS `mktemp` ignoring TMPDIR without an explicit template -- so
    # both still need covering. macOS is covered by development itself: the suite
    # is written and run there before anything is pushed. Linux is the half nobody
    # exercises by hand, which is exactly the half worth spending CI on.
    #
    # The cost of dropping it: a macOS-only regression now lands whenever a push
    # happens without a local run first, and a contributor on Linux gets no signal
    # at all. If either starts happening, put macos-latest back as a matrix entry
    # (fail-fast: false) rather than inventing something cleverer.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # npm rather than apt: it pins one bats version regardless of runner image,
      # and the distro package lags far enough behind to differ. Into a user prefix
      # because a plain `npm install -g` is EACCES on the Linux runner, and reaching
      # for sudo to work around that is how a CI setup starts diverging from how
      # anyone actually installs the thing.
      - name: Install bats
        run: |
          npm install -g --prefix "$HOME/.npm-global" bats
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"

      # GNU parallel is what `bats --jobs` shells out to. Without it bats does not
      # fail, it silently runs serially -- so this step existing is the only thing
      # separating a parallel run from a slow one that looks identical in the log.
      # Restoring macos-latest means restoring a `brew install parallel` branch here
      # too. Left as apt-only rather than keeping a dead $RUNNER_OS conditional: an
      # unreachable branch is not a spare tyre, it is a thing that rots unnoticed.
      - name: Install GNU parallel
        run: sudo apt-get update -qq && sudo apt-get install -y parallel

      # The suite runs `synapse-fake`: `synapse tags` with the grammar
      # compile-and-load step stubbed, which is what replaced the fake
      # `tree-sitter` on PATH once libtree-sitter was linked instead of
      # spawned. This job therefore needs a toolchain even though it is not the
      # job that checks the Zig -- the alternative is a bats suite with no
      # tagger in it at all. Same unpinned action as the `zig` job, for the
      # same reason: `build.zig.zon` is the only place the version lives.
      #
      # cache-size-limit raised the same way as the `zig` job above -- this
      # job's own cache measured 1.9 GB on a normal run (every bats test
      # compiling and loading a real tree-sitter grammar into its own
      # `.zig-cache`), close enough to the 2048 MiB default that it risked
      # the save being skipped outright.
      - uses: mlugg/setup-zig@v2
        with:
          cache-size-limit: 4096

      # All three binaries, not just the fake. `zig build fake` installs only
      # `synapse-fake`, and this job needs the other two as well: every test's
      # common_setup requires `synapse-hook` (the hooks link no grammar, so a test
      # exercises the real one), and the docs check below runs the real `synapse`
      # for its `--help`. Both were absent when this said `zig build fake` alone.
      - name: Build the binaries the suite runs
        run: |
          zig build
          zig build fake

      - name: Show versions
        run: |
          bats --version
          bash --version | head -1
          jq --version
          sed --version 2>/dev/null | head -1 || true
          sed --version >/dev/null 2>&1 || echo "sed: BSD (no --version)"
          python3 --version

      # git config is required: several tests commit to a scratch repo, and a
      # runner has no global identity, so the commit would fail rather than the
      # assertion being exercised.
      - name: Configure git identity for scratch repos
        run: |
          git config --global user.email ci@example.com
          git config --global user.name CI

      # --jobs parallelises within each file as well as across them, which is where
      # the win is: one file is a quarter of the suite, so across-files-only would
      # leave it as the critical path. Safe because every test builds its own
      # $HOME/repo/vault under mktemp and tears it down; see README's Testing
      # section for the invariant this depends on.
      - name: Run the suite
        run: bats --jobs "$(getconf _NPROCESSORS_ONLN)" tests/

      # Both generated artefacts are already verified inside the suite, by their
      # own --check mode. Repeated here only so a failure names itself in the log
      # rather than arriving as one line inside a 238-test run.
      - name: Generated docs are in sync
        if: always()
        run: |
          ./docs/synapse/generate-cli-reference.sh --check
          ./docs/synapse-bard/generate-cli-reference.sh --check

      - name: Rendered diagrams are in sync
        if: always()
        run: ./docs/synapse/generate-diagrams.sh --check
