name: Deploy private Synapse live
on:
  push:
    branches: [feature/pwa-remote-host-foundation]
permissions:
  contents: read
concurrency:
  group: synapse-private-live
  cancel-in-progress: false
jobs:
  deploy:
    if: vars.SYNAPSE_LIVE_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: live
    env:
      DEPLOY_REPOSITORY: ${{ github.repository }}
      DEPLOY_COMMIT: ${{ github.sha }}
    steps:
      - name: Prepare temporary repository authentication
        env:
          DEPLOY_TOKEN: ${{ github.token }}
        run: |
          auth="$(printf 'x-access-token:%s' "$DEPLOY_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          echo "DEPLOY_GIT_AUTH=$auth" >> "$GITHUB_ENV"
      - name: Deploy private live project
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          fingerprint: ${{ secrets.VPS_FINGERPRINT }}
          envs: DEPLOY_REPOSITORY,DEPLOY_COMMIT,DEPLOY_GIT_AUTH
          script: |
            set -eu
            test "$(whoami)" = synapse-deploy
            export DOCKER_HOST=unix:///run/user/1001/docker.sock
            unset DOCKER_CONTEXT
            test -S /run/user/1001/docker.sock
            docker info --format '{{json .SecurityOptions}}' | grep -q '"name=rootless"'
            cd /opt/synapse
            test -d .git
            test -f .env.live
            git remote set-url origin "https://github.com/${DEPLOY_REPOSITORY}.git"
            GIT_TERMINAL_PROMPT=0 git -c credential.helper= \
              -c http.https://github.com/.extraheader= \
              -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $DEPLOY_GIT_AUTH" \
              fetch --no-tags origin "$DEPLOY_COMMIT"
            unset DEPLOY_GIT_AUTH
            git checkout --detach "$DEPLOY_COMMIT"
            docker compose --env-file .env.live -f synapse_desktop/compose.private-staging.yml -p synapse-live up -d --build
