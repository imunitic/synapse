name: release

# A release is cut by pushing a tag (`vX.Y.Z`), not by every push to main --
# main can move freely with nothing building or publishing. workflow_dispatch
# takes an explicit `tag` input for a manual re-run and checks out that tag
# rather than whatever ref triggered the dispatch, so a manual run can never
# accidentally build off an untagged commit.
#
# Deliberately independent of tests.yml, which also runs on every push: a
# compile failure here fails this workflow's own build step the same way it
# would there (both run the identical `zig build -Dtarget=...` per release
# target), so there is no real gap in the common case, and chaining this
# workflow behind tests.yml's own success would only add latency to every
# release for a case (compiles fine, fails a unit/bats test) a maintainer
# tagging a known-good commit has already accepted responsibility for.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (must already exist, e.g. v0.2.0)"
        required: true

permissions:
  contents: write
  # OIDC for npm's Trusted Publishing -- lets `npm publish` mint a
  # short-lived token itself instead of reading a stored NPM_TOKEN secret.
  # Requires Trusted Publisher configured per-package on npmjs.com first
  # (pointing at this workflow file), which only becomes possible after a
  # package's first publish -- see the release job's own publish step.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    # Two tags pushed close together could still both reach the "Publish
    # binaries to the dist branch" step concurrently; that step force-pushes
    # a fresh orphan history, so two overlapping runs could race and one's
    # publish could stomp the other's. Queue, don't cancel -- a cancelled
    # run would silently drop a real tag's release rather than just delay it.
    concurrency:
      group: release-tag
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      # No version pinned here -- resolved from build.zig.zon's
      # minimum_zig_version, same reasoning as tests.yml.
      - uses: mlugg/setup-zig@v2

      - name: Resolve the release tag
        id: tag
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      # Same targets ci/build-targets.sh verifies compile on every push;
      # this job packages the same builds instead of discarding them. See
      # ci/release-targets.sh for the one shared definition of the list.
      # `zig build` with no step name builds every installed artifact for
      # that target in one invocation -- synapse-bard/synapse-bard-hook
      # included, since build.zig registers them unconditionally -- so
      # bard needs no cross-compile step of its own, one extra tar line
      # per target already being built here is enough. Ships the same
      # platform set as synapse, not narrowed to her own machine's
      # architecture: nothing about the binary depends on which session
      # type downloads it.
      - name: Cross-compile and package each target
        run: |
          source ci/release-targets.sh
          for t in "${targets[@]}"; do
            out="out/$t"
            zig build -Dtarget="$t" -Doptimize=ReleaseSafe -p "$out"
            tar -C "$out/bin" -czf "synapse-$t.tar.gz" synapse synapse-hook
            tar -C "$out/bin" -czf "synapse-bard-$t.tar.gz" synapse-bard synapse-bard-hook
          done
          sha256sum synapse-*.tar.gz > SHA256SUMS

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      # Trusted Publishing needs a recent npm CLI (the OIDC exchange isn't
      # in whatever ships with Node 20's bundled npm) -- upgrading here
      # rather than pinning a newer Node version keeps the zig/test image
      # story untouched everywhere else in this repo.
      - name: Upgrade npm for OIDC trusted-publishing support
        run: npm install -g npm@latest

      # One tag, one version, four packages -- npm has no cross-package
      # transaction, so this is as atomic as it gets: a single step, a
      # single job, one sequential loop. If a publish partway through
      # fails, the job just stops there (nothing rolls back the packages
      # that already published), but nothing races either, since nothing
      # here runs concurrently. Strips the leading `v` since npm's version
      # field must be bare semver; platform packages publish before the
      # main package so its optionalDependencies always resolve to a
      # version that already exists on the registry.
      #
      # No NODE_AUTH_TOKEN -- OIDC trusted publishing (id-token: write
      # above, plus each package's Trusted Publisher configured on
      # npmjs.com to trust this exact workflow file) is what authenticates
      # instead. npm detects the GitHub Actions OIDC environment
      # automatically; nothing here has to request or pass a token by hand.
      - name: Publish npm packages in lock-step
        run: |
          source ci/release-targets.sh
          v="${{ steps.tag.outputs.tag }}"
          v="${v#v}"

          # npm refuses to publish a prerelease version (anything with a
          # `-` in it, e.g. `0.1.0-experimental`) to the default `latest`
          # dist-tag without an explicit --tag -- derives one from the
          # version's own prerelease identifier (the part between the
          # first `-` and the next `.`, e.g. `experimental` out of
          # `0.1.0-experimental`, `test` out of `0.0.1-test.0`) rather than
          # hardcoding one, so a real non-prerelease tag still publishes to
          # `latest` unchanged.
          dist_tag="latest"
          case "$v" in
            *-*)
              pre="${v#*-}"
              dist_tag="${pre%%.*}"
              ;;
          esac

          # Translates a Zig cross-compile triple to the npm platform
          # package it feeds -- npm's `os`/`cpu` fields select on
          # process.platform/process.arch, an unrelated naming scheme to
          # Zig's target triples, so this is the one place the two are
          # bridged. Fails loudly on an unmapped target rather than
          # silently skipping it, so a new entry in ci/release-targets.sh
          # can't ship without a matching npm platform package.
          npm_platform_for() {
            case "$1" in
              x86_64-linux) echo linux-x64 ;;
              aarch64-linux) echo linux-arm64 ;;
              aarch64-macos) echo darwin-arm64 ;;
              *)
                echo "no npm platform package mapped for target: $1" >&2
                exit 1
                ;;
            esac
          }

          for t in "${targets[@]}"; do
            plat="$(npm_platform_for "$t")"
            dest="npm-pkg/platforms/$plat/bin"
            mkdir -p "$dest"
            cp "out/$t/bin/synapse" "out/$t/bin/synapse-hook" "$dest/"
            tmp=$(mktemp)
            jq --arg v "$v" '.version = $v' "npm-pkg/platforms/$plat/package.json" > "$tmp"
            mv "$tmp" "npm-pkg/platforms/$plat/package.json"
            npm publish "npm-pkg/platforms/$plat" --access public --tag "$dist_tag"
          done

          tmp=$(mktemp)
          jq --arg v "$v" '.version = $v | .optionalDependencies |= map_values($v)' \
            npm-pkg/package.json > "$tmp"
          mv "$tmp" npm-pkg/package.json
          npm publish npm-pkg --access public --tag "$dist_tag"

      # Real, versioned, permanently-fetchable binaries for `synapse` --
      # unlike `dist` below (bard-only, force-pushed, latest-release-only),
      # GitHub Release assets persist per tag forever, so any consumer
      # (the harness setup script today; `fetch-and-run.cjs` itself once
      # sb-040 repoints it) can pin to an exact version's binary rather
      # than whatever happens to be currently published. `synapse-bard`'s
      # own binaries stay `dist`-only below -- Android cloud sessions can't
      # reach Release-asset URLs at all (see that step's own comment),
      # which is the entire reason `dist` exists; `synapse`'s consumers
      # have no such constraint, so there's no reason to make them pay for
      # it too.
      - name: Publish synapse binaries to a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source ci/release-targets.sh
          assets=(SHA256SUMS)
          for t in "${targets[@]}"; do
            assets+=("synapse-$t.tar.gz")
          done
          gh release create "${{ steps.tag.outputs.tag }}" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "${{ steps.tag.outputs.tag }}" \
            --notes "Automated release. See commit history for changes."

      # SHA256SUMS travels alongside the tarballs on `dist` so each
      # fetch-and-run.cjs can verify what it downloaded before executing it --
      # raw.githubusercontent.com is plain HTTP-over-TLS to GitHub's CDN, not
      # a signed artifact channel, so TLS alone only proves the bytes came
      # from GitHub, not that they're the bytes this workflow published.
      #
      # No GitHub Release, no release assets -- binaries are published as
      # plain committed files on the `dist` branch instead (see below), which
      # `fetch-and-run.cjs` reads through `raw.githubusercontent.com`. That
      # domain is unauthenticated, unscoped, ordinary Trusted-allowlist
      # traffic in an Anthropic-hosted cloud sandbox; GitHub Release assets
      # are not -- release-asset requests route through a repo-scoped GitHub
      # proxy there, and get a 403 for any repo other than the one the
      # session is attached to. `synapse-bard`'s Android cloud sessions are
      # attached to the *bible* repo, never this one, so its binaries could
      # never actually reach them over the old release-download URL.
      #
      # A fresh orphan history every run, force-pushed over whatever was on
      # `dist` before -- built in a scratch directory outside this job's own
      # checkout so there's no working tree to reconcile, no fetch, no
      # merge, and no growing history to ever prune. `dist` holds exactly
      # the latest release's binaries plus ci/dist-readme.md (as README.md,
      # so it renders on the branch's own GitHub page), nothing else, ever.
      - name: Publish binaries to the dist branch
        run: |
          source ci/release-targets.sh
          publish_dir="$(mktemp -d)"
          for t in "${targets[@]}"; do
            cp "synapse-$t.tar.gz" "synapse-bard-$t.tar.gz" "$publish_dir/"
          done
          cp SHA256SUMS "$publish_dir/"
          cp ci/dist-readme.md "$publish_dir/README.md"
          cd "$publish_dir"
          git init -q -b dist
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "dist: ${{ steps.tag.outputs.tag }}"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" dist
