name: release

# A release is cut by pushing a tag (`vX.Y.Z`), not by every push to main.
# Builds the binaries natively on each platform Synapse ships for, packages
# them as the npm platform packages and checks the installed result end to end
# (`ci/package.sh`), then publishes ten packages in lock-step: `synapse` and
# `synapse-pipeline`, each with a package per platform. workflow_dispatch takes
# an explicit `tag` input for a manual re-run and checks out that tag rather than whatever ref
# triggered the dispatch, so a manual run can never build off an untagged
# commit; `dry_run` makes it an `npm publish --dry-run`.
#
# Publishing authenticates with npm's Trusted Publishing, which only works for a
# package that already exists on the registry and names this workflow as its
# publisher. `use_token` publishes with the repository secret `NPM_TOKEN`
# instead, for the one run that creates a new package; after that run each new
# package is given its Trusted Publisher and the input is not used again.
#
# The `desktop` job builds Synapse Desktop for macOS on Apple Silicon around the
# macOS programs of `build` (`ci/desktop-release.sh`), checks that they and the
# app report the tag's version, and puts the .dmg on the tag's GitHub Release.
#
# A pull request that touches how the binaries are built runs the `build` job,
# the three platforms, the glibc floor and the package check, with the binaries
# kept as artifacts, and the `desktop` job, which keeps its .dmg as an artifact.
# `publish` never runs for a pull request, and nothing is put on a release.
#
# The Linux binaries are built by `ci/linux-release.sh`, which compiles and
# links against a glibc 2.28 sysroot from an AlmaLinux 8 image; the script and
# the package check both fail if a binary asks for a newer glibc.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "ci/**"
      - "synapse/**"
      - "synapse_cli/**"
      - "synapse_pipeline/**"
      - "packages/**"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (must already exist, e.g. v0.2.0)"
        required: true
      dry_run:
        description: "Run `npm publish --dry-run` instead of publishing"
        type: boolean
        default: false
      use_token:
        description: "Publish with the NPM_TOKEN secret, to create packages that do not exist yet"
        type: boolean
        default: false

permissions:
  contents: write
  # OIDC for npm's Trusted Publishing: `npm publish` mints a short-lived token
  # itself instead of reading a stored secret. Each package's Trusted Publisher
  # on npmjs.com must name this workflow file.
  id-token: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, plat: linux-x64 }
          - { os: ubuntu-24.04-arm, plat: linux-arm64 }
          # macos-15, not macos-latest: the macOS 26 image's SDK lists an
          # architecture that the linker of the GNAT toolchain rejects.
          - { os: macos-15, plat: darwin-arm64 }
          - { os: windows-latest, plat: win32-x64 }
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: alire-project/setup-alire@v6
        if: runner.os != 'Linux'
      - uses: extractions/setup-just@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # The programs report the version of their crate, which is the tag.
      - name: Set the version the programs report
        if: startsWith(github.event.inputs.tag || github.ref_name, 'v')
        shell: bash
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          v="${TAG#v}"
          for crate in synapse synapse_cli synapse_pipeline; do
            sed -i.bak "s/^version = \".*\"/version = \"$v\"/" "$crate/alire.toml"
            rm "$crate/alire.toml.bak"
          done

      - name: Build the Linux binaries against glibc 2.28
        if: runner.os == 'Linux'
        run: ci/linux-release.sh

      - name: Build the macOS and Windows binaries
        if: runner.os != 'Linux'
        run: just release

      - name: Check the installed package
        env:
          GLIBC_FLOOR: ${{ runner.os == 'Linux' && '2.28' || '' }}
        shell: bash
        run: ci/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.plat }}
          path: |
            synapse_cli/bin/synapse
            synapse_cli/bin/synapse-hook
            synapse_cli/bin/synapse.exe
            synapse_cli/bin/synapse-hook.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: pipeline-${{ matrix.plat }}
          path: |
            synapse_pipeline/bin/synapse-pipeline
            synapse_pipeline/bin/synapse-pipeline.exe
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: release-tag
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm for OIDC trusted-publishing support
        run: npm install -g npm@latest

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # One version, ten packages, the platform packages first so each main
      # package's optional dependencies already resolve. A version already on
      # the registry is skipped, so a retry after a partial failure works.
      - name: Publish the npm packages in lock-step
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          USE_TOKEN: ${{ github.event.inputs.use_token }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "$USE_TOKEN" = "true" ]; then
            [ -n "$NPM_TOKEN" ] || { echo "use_token needs the NPM_TOKEN secret" >&2; exit 1; }
            export NODE_AUTH_TOKEN="$NPM_TOKEN"
          fi
          v="${TAG#v}"
          dist_tag="latest"
          case "$v" in
            *-*) pre="${v#*-}"; dist_tag="${pre%%.*}" ;;
          esac
          dry=(--dry-run)
          [ "$DRY_RUN" = "true" ] || dry=()

          publish_if_new() {
            local dir="$1" name="$2"
            if npm view "$name@$v" version >/dev/null 2>&1; then
              echo "$name@$v already published -- skipping"
            else
              npm publish "./$dir" --access public --tag "$dist_tag" "${dry[@]}"
            fi
          }

          for plat in linux-x64 linux-arm64 darwin-arm64 win32-x64; do
            dest="packages/synapse/platforms/$plat/bin"
            exe=""
            [ "$plat" = win32-x64 ] && exe=".exe"
            mkdir -p "$dest"
            cp "artifacts/bin-$plat/synapse$exe" "artifacts/bin-$plat/synapse-hook$exe" "$dest/"
            chmod +x "$dest/synapse$exe" "$dest/synapse-hook$exe"
            tmp=$(mktemp)
            jq --arg v "$v" '.version = $v' "packages/synapse/platforms/$plat/package.json" > "$tmp"
            mv "$tmp" "packages/synapse/platforms/$plat/package.json"
            publish_if_new "packages/synapse/platforms/$plat" "@imunitic/synapse-$plat"

            pdest="packages/synapse-pipeline/platforms/$plat/bin"
            mkdir -p "$pdest"
            cp "artifacts/pipeline-$plat/synapse-pipeline$exe" "$pdest/"
            chmod +x "$pdest/synapse-pipeline$exe"
            tmp=$(mktemp)
            jq --arg v "$v" '.version = $v' "packages/synapse-pipeline/platforms/$plat/package.json" > "$tmp"
            mv "$tmp" "packages/synapse-pipeline/platforms/$plat/package.json"
            publish_if_new "packages/synapse-pipeline/platforms/$plat" "@imunitic/synapse-pipeline-$plat"
          done

          tmp=$(mktemp)
          jq --arg v "$v" '.version = $v | .optionalDependencies |= map_values($v)' \
            packages/synapse/package.json > "$tmp"
          mv "$tmp" packages/synapse/package.json
          publish_if_new "packages/synapse" "@imunitic/synapse"

          tmp=$(mktemp)
          jq --arg v "$v" '.version = $v | .optionalDependencies |= map_values($v)' \
            packages/synapse-pipeline/package.json > "$tmp"
          mv "$tmp" packages/synapse-pipeline/package.json
          publish_if_new "packages/synapse-pipeline" "@imunitic/synapse-pipeline"

  # Synapse Desktop for macOS on Apple Silicon: the app with the programs of the
  # `build` job inside, so it ships what the npm packages ship, at the tag's
  # version. The bundle is ad-hoc signed and not notarized; the README says how
  # to open it. For a tag the .dmg goes on the tag's GitHub Release; for a pull
  # request or a `dry_run` it is kept as an artifact. It does not wait for
  # `publish`, so either can fail without stopping the other.
  desktop:
    needs: build
    # macos-15 like the macOS build above, whose programs it bundles.
    runs-on: macos-15
    # One run at a time for a tag, so that two never create its release at once.
    concurrency:
      group: desktop-${{ github.event.inputs.tag || github.ref }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # A tag releases its version; anything else is a build of the checkout,
      # whose programs say 0.0.0-dev and whose app says 0.0.0.
      - name: Decide what this run releases
        id: what
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          if [ "$EVENT" != pull_request ] && [[ "$TAG" == v* ]]; then
            v="${TAG#v}"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "programs=$v" >> "$GITHUB_OUTPUT"
            echo "app=$v" >> "$GITHUB_OUTPUT"
            if [ "$DRY_RUN" = true ]; then publish=false; else publish=true; fi
          else
            echo "programs=0.0.0-dev" >> "$GITHUB_OUTPUT"
            echo "app=0.0.0" >> "$GITHUB_OUTPUT"
            publish=false
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: synapse_desktop/package-lock.json

      - name: Toolchain
        run: rustup toolchain install stable --profile minimal

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            synapse_desktop/src-tauri/target
          key: cargo-desktop-release-${{ hashFiles('synapse_desktop/src-tauri/Cargo.lock') }}
          restore-keys: cargo-desktop-release-

      - uses: actions/download-artifact@v4
        with:
          name: bin-darwin-arm64
          path: synapse_cli/bin

      - uses: actions/download-artifact@v4
        with:
          name: pipeline-darwin-arm64
          path: synapse_pipeline/bin

      # An artifact does not keep the executable bit.
      - name: Make the programs executable
        run: chmod +x synapse_cli/bin/synapse synapse_cli/bin/synapse-hook synapse_pipeline/bin/synapse-pipeline

      - name: Set the app's version
        if: steps.what.outputs.tag != ''
        run: ci/desktop-release.sh set-version "${{ steps.what.outputs.app }}"

      - name: Build the app
        working-directory: synapse_desktop
        run: |
          npm ci
          npm run stage
          npx tauri build --features app --bundles app,dmg -- --bin synapse-desktop

      - name: Check the app
        run: |
          ci/desktop-release.sh check \
            "synapse_desktop/src-tauri/target/release/bundle/macos/Synapse Desktop.app" \
            "${{ steps.what.outputs.programs }}" "${{ steps.what.outputs.app }}"

      - name: Find the .dmg
        id: dmg
        run: |
          shopt -s nullglob
          found=(synapse_desktop/src-tauri/target/release/bundle/dmg/*.dmg)
          [ "${#found[@]}" -eq 1 ] || { echo "expected one .dmg, found ${#found[@]}" >&2; exit 1; }
          echo "path=${found[0]}" >> "$GITHUB_OUTPUT"

      - name: Keep the .dmg
        if: steps.what.outputs.publish != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: synapse-desktop-darwin-arm64
          path: ${{ steps.dmg.outputs.path }}
          if-no-files-found: error

      - name: Put the .dmg on the tag's GitHub Release
        if: steps.what.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.what.outputs.tag }}
          DMG: ${{ steps.dmg.outputs.path }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --verify-tag --title "$TAG" --notes ""
          gh release upload "$TAG" "$DMG" --clobber
