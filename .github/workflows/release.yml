name: release

# Every push to main is a release -- no semantic versioning, no manual tag,
# no version-bump decision. See designs/synapse/sb — Convert Synapse into a
# proper Claude Code plugin.md for why: a static or hand-bumped version
# string in plugin.json silently breaks Claude Code's update detection, so
# the only sustainable choice is a version that changes on its own, every
# time, mechanically.
#
# Deliberately independent of tests.yml, which also runs on every push: a
# compile failure here fails this workflow's own build step the same way it
# would there (both run the identical `zig build -Dtarget=...` per release
# target), so there is no real gap in the common case, and chaining this
# workflow behind tests.yml's own success would only add latency to every
# release for a case (compiles fine, fails a unit/bats test) this rolling
# model already accepts as the cost of shipping continuously.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Belt-and-suspenders alongside the `push: branches: [main]` trigger
    # above: that trigger already keeps a feature-branch push from starting
    # this job, but `workflow_dispatch` has no branch restriction of its own
    # and can be fired against any ref. Without this, a manual dispatch off a
    # feature branch would still compute a tag, push it, and force-push a
    # fresh orphan history over `dist` from that branch's code.
    if: github.ref == 'refs/heads/main'

    # The tag above is computed from the repo's own git tags at the *start*
    # of a run, but publishing happens after a multi-minute cross-compile
    # step -- two pushes close enough together both read the same "highest N
    # so far" before either has published, compute the same next tag, and
    # whichever finishes compiling first wins; the other fails to push a tag
    # that now already exists (confirmed live for the equivalent GitHub
    # Release race, 2026-08-19, before this moved to plain git tags).
    # `cancel-in-progress: false`: queue, don't cancel -- a cancelled run
    # would silently drop a real commit's release rather than just delay it.
    concurrency:
      group: release-tag
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v5

      # No version pinned here -- resolved from build.zig.zon's
      # minimum_zig_version, same reasoning as tests.yml.
      - uses: mlugg/setup-zig@v2

      # $(date +%Y-%m)_N, N = the highest N already used this month, plus
      # one. Mechanical, not a judgment call -- see the file header.
      # Underscore before N, not a third hyphen: YYYY-MM-N reads as a
      # truncated date at a glance, YYYY-MM_N doesn't.
      #
      # The highest N, not a count of currently-existing tags -- a count
      # silently goes backwards the moment any tag from this month is ever
      # deleted. Taking the max instead is monotonic regardless of what got
      # deleted in between. Matches both separators so it still sees earlier
      # hyphen-separated tags from before this format existed.
      #
      # Reads `git ls-remote --tags`, not a local `git tag -l`: the checkout
      # above is a shallow, single-branch clone with no tag refs fetched, so
      # a local listing would silently see nothing every run.
      - name: Compute the release tag
        id: tag
        run: |
          prefix="$(date +%Y-%m)"
          max=0
          while read -r n; do
            case "$n" in '' | *[!0-9]*) continue ;; esac
            [ "$n" -gt "$max" ] && max="$n"
          done < <(git ls-remote --tags origin \
            | sed -nE "s#^.*refs/tags/${prefix}[_-]([0-9]+)\$#\1#p")
          echo "tag=${prefix}_$((max + 1))" >> "$GITHUB_OUTPUT"

      # The one place either plugin.json's version is ever written. Never by
      # hand -- see the design note for why a version that stops changing
      # silently breaks Claude Code's update detection. Both plugins share
      # one tag: they ship from the same push, so there's no meaningful
      # sense in which one could be "newer" than the other.
      - name: Stamp both plugin.json files with the release tag
        run: |
          tmp=$(mktemp)
          jq --arg v "${{ steps.tag.outputs.tag }}" '.version = $v' \
            plugins/synapse/.claude-plugin/plugin.json > "$tmp"
          mv "$tmp" plugins/synapse/.claude-plugin/plugin.json
          jq --arg v "${{ steps.tag.outputs.tag }}" '.version = $v' \
            plugins/synapse-bard/.claude-plugin/plugin.json > "$tmp"
          mv "$tmp" plugins/synapse-bard/.claude-plugin/plugin.json

      - name: Commit the version stamp
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add plugins/synapse/.claude-plugin/plugin.json plugins/synapse-bard/.claude-plugin/plugin.json
          # Nothing to commit is not a failure -- workflow_dispatch on an
          # already-stamped commit, or a re-run, land here.
          git diff --cached --quiet || git commit -m "chore: stamp plugin.json for ${{ steps.tag.outputs.tag }}"
          git push

      # Same targets ci/build-targets.sh verifies compile on every push;
      # this job packages the same builds instead of discarding them. See
      # ci/release-targets.sh for the one shared definition of the list.
      # `zig build` with no step name builds every installed artifact for
      # that target in one invocation -- synapse-bard/synapse-bard-hook
      # included, since build.zig registers them unconditionally -- so
      # bard needs no cross-compile step of its own, one extra tar line
      # per target already being built here is enough. Ships the same
      # platform set as synapse, not narrowed to her own machine's
      # architecture: nothing about the binary depends on which session
      # type downloads it.
      - name: Cross-compile and package each target
        run: |
          source ci/release-targets.sh
          for t in "${targets[@]}"; do
            out="out/$t"
            zig build -Dtarget="$t" -Doptimize=ReleaseSafe -p "$out"
            tar -C "$out/bin" -czf "synapse-$t.tar.gz" synapse synapse-hook
            tar -C "$out/bin" -czf "synapse-bard-$t.tar.gz" synapse-bard synapse-bard-hook
          done
          sha256sum synapse-*.tar.gz > SHA256SUMS

      # A plain git tag, not a GitHub Release -- no changelog, no assets
      # attached, just the monotonic version marker `fetch-and-run.sh` reads
      # via plugin.json and a human-readable pointer at this commit.
      - name: Tag the release commit
        run: |
          git tag "${{ steps.tag.outputs.tag }}"
          git push origin "${{ steps.tag.outputs.tag }}"

      # SHA256SUMS travels alongside the tarballs on `dist` so each
      # fetch-and-run.sh can verify what it downloaded before executing it --
      # raw.githubusercontent.com is plain HTTP-over-TLS to GitHub's CDN, not
      # a signed artifact channel, so TLS alone only proves the bytes came
      # from GitHub, not that they're the bytes this workflow published.
      #
      # No GitHub Release, no release assets -- binaries are published as
      # plain committed files on the `dist` branch instead (see below), which
      # `fetch-and-run.sh` reads through `raw.githubusercontent.com`. That
      # domain is unauthenticated, unscoped, ordinary Trusted-allowlist
      # traffic in an Anthropic-hosted cloud sandbox; GitHub Release assets
      # are not -- release-asset requests route through a repo-scoped GitHub
      # proxy there, and get a 403 for any repo other than the one the
      # session is attached to. `synapse-bard`'s Android cloud sessions are
      # attached to the *bible* repo, never this one, so its binaries could
      # never actually reach them over the old release-download URL.
      #
      # A fresh orphan history every run, force-pushed over whatever was on
      # `dist` before -- built in a scratch directory outside this job's own
      # checkout so there's no working tree to reconcile, no fetch, no
      # merge, and no growing history to ever prune. `dist` holds exactly
      # the latest release's binaries plus ci/dist-readme.md (as README.md,
      # so it renders on the branch's own GitHub page), nothing else, ever.
      - name: Publish binaries to the dist branch
        run: |
          source ci/release-targets.sh
          publish_dir="$(mktemp -d)"
          for t in "${targets[@]}"; do
            cp "synapse-$t.tar.gz" "synapse-bard-$t.tar.gz" "$publish_dir/"
          done
          cp SHA256SUMS "$publish_dir/"
          cp ci/dist-readme.md "$publish_dir/README.md"
          cd "$publish_dir"
          git init -q -b dist
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "dist: ${{ steps.tag.outputs.tag }}"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" dist

  # Independent of the release job above -- docs aren't tied to a specific
  # release tag, and there's nothing here for the two to coordinate on.
  #
  # One-time manual prerequisite this workflow cannot do for itself: repo
  # Settings -> Pages -> Source: "GitHub Actions". Until that's set, this job
  # runs and uploads an artifact but has nowhere to deploy it.
  #
  # Deploys docs/generate-site.sh's build output, not docs/ itself -- raw
  # markdown uploaded as-is has no landing page and doesn't render.
  pages:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/configure-pages@v5

      # Raw docs/**/*.md, uploaded as-is, isn't a browsable site -- no
      # rendering, no landing page. docs/generate-site.sh converts every doc
      # to real HTML via pandoc (rewriting the .md cross-links pandoc itself
      # leaves untouched), building one section per plugin
      # (docs/synapse/, docs/synapse-bard/) under a shared top-level landing
      # page derived from the repo's own README.md.
      - name: Install pandoc
        run: sudo apt-get update -y && sudo apt-get install -y pandoc

      - name: Build the docs site
        run: ./docs/generate-site.sh site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/deploy-pages@v4
        id: deployment
