name: release

# A release is cut by pushing a tag (`vX.Y.Z`), not by every push to main.
# Builds the binaries natively on each platform Synapse ships for, packages
# them as the npm platform packages and checks the installed result end to end
# (`ci/package.sh`), then publishes ten packages in lock-step: `synapse` and
# `synapse-pipeline`, each with a package per platform. workflow_dispatch takes
# an explicit `tag` input for a manual re-run and checks out that tag rather than whatever ref
# triggered the dispatch, so a manual run can never build off an untagged
# commit; `dry_run` makes it an `npm publish --dry-run`.
#
# Publishing authenticates with npm's Trusted Publishing, which only works for a
# package that already exists on the registry and names this workflow as its
# publisher. `use_token` publishes with the repository secret `NPM_TOKEN`
# instead, for the one run that creates a new package; after that run each new
# package is given its Trusted Publisher and the input is not used again.
#
# A pull request that touches how the binaries are built runs the `build` job
# alone: the three platforms, the glibc floor and the package check, with the
# binaries kept as artifacts. `publish` never runs for a pull request.
#
# The Linux binaries are built by `ci/linux-release.sh`, which compiles and
# links against a glibc 2.28 sysroot from an AlmaLinux 8 image; the script and
# the package check both fail if a binary asks for a newer glibc.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "ci/**"
      - "synapse/**"
      - "synapse_cli/**"
      - "synapse_pipeline/**"
      - "packages/**"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (must already exist, e.g. v0.2.0)"
        required: true
      dry_run:
        description: "Run `npm publish --dry-run` instead of publishing"
        type: boolean
        default: false
      use_token:
        description: "Publish with the NPM_TOKEN secret, to create packages that do not exist yet"
        type: boolean
        default: false

permissions:
  contents: write
  # OIDC for npm's Trusted Publishing: `npm publish` mints a short-lived token
  # itself instead of reading a stored secret. Each package's Trusted Publisher
  # on npmjs.com must name this workflow file.
  id-token: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, plat: linux-x64 }
          - { os: ubuntu-24.04-arm, plat: linux-arm64 }
          # macos-15, not macos-latest: the macOS 26 image's SDK lists an
          # architecture that the linker of the GNAT toolchain rejects.
          - { os: macos-15, plat: darwin-arm64 }
          - { os: windows-latest, plat: win32-x64 }
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: alire-project/setup-alire@v6
        if: runner.os != 'Linux'
      - uses: extractions/setup-just@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build the Linux binaries against glibc 2.28
        if: runner.os == 'Linux'
        run: ci/linux-release.sh

      - name: Build the macOS and Windows binaries
        if: runner.os != 'Linux'
        run: just release

      - name: Check the installed package
        env:
          GLIBC_FLOOR: ${{ runner.os == 'Linux' && '2.28' || '' }}
        shell: bash
        run: ci/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.plat }}
          path: |
            synapse_cli/bin/synapse
            synapse_cli/bin/synapse-hook
            synapse_cli/bin/synapse.exe
            synapse_cli/bin/synapse-hook.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: pipeline-${{ matrix.plat }}
          path: |
            synapse_pipeline/bin/synapse-pipeline
            synapse_pipeline/bin/synapse-pipeline.exe
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: release-tag
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm for OIDC trusted-publishing support
        run: npm install -g npm@latest

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # One version, ten packages, the platform packages first so each main
      # package's optional dependencies already resolve. A version already on
      # the registry is skipped, so a retry after a partial failure works.
      - name: Publish the npm packages in lock-step
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          USE_TOKEN: ${{ github.event.inputs.use_token }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "$USE_TOKEN" = "true" ]; then
            [ -n "$NPM_TOKEN" ] || { echo "use_token needs the NPM_TOKEN secret" >&2; exit 1; }
            export NODE_AUTH_TOKEN="$NPM_TOKEN"
          fi
          v="${TAG#v}"
          dist_tag="latest"
          case "$v" in
            *-*) pre="${v#*-}"; dist_tag="${pre%%.*}" ;;
          esac
          dry=(--dry-run)
          [ "$DRY_RUN" = "true" ] || dry=()

          publish_if_new() {
            local dir="$1" name="$2"
            if npm view "$name@$v" version >/dev/null 2>&1; then
              echo "$name@$v already published -- skipping"
            else
              npm publish "./$dir" --access public --tag "$dist_tag" "${dry[@]}"
            fi
          }

          for plat in linux-x64 linux-arm64 darwin-arm64 win32-x64; do
            dest="packages/synapse/platforms/$plat/bin"
            exe=""
            [ "$plat" = win32-x64 ] && exe=".exe"
            mkdir -p "$dest"
            cp "artifacts/bin-$plat/synapse$exe" "artifacts/bin-$plat/synapse-hook$exe" "$dest/"
            chmod +x "$dest/synapse$exe" "$dest/synapse-hook$exe"
            tmp=$(mktemp)
            jq --arg v "$v" '.version = $v' "packages/synapse/platforms/$plat/package.json" > "$tmp"
            mv "$tmp" "packages/synapse/platforms/$plat/package.json"
            publish_if_new "packages/synapse/platforms/$plat" "@imunitic/synapse-$plat"

            pdest="packages/synapse-pipeline/platforms/$plat/bin"
            mkdir -p "$pdest"
            cp "artifacts/pipeline-$plat/synapse-pipeline$exe" "$pdest/"
            chmod +x "$pdest/synapse-pipeline$exe"
            tmp=$(mktemp)
            jq --arg v "$v" '.version = $v' "packages/synapse-pipeline/platforms/$plat/package.json" > "$tmp"
            mv "$tmp" "packages/synapse-pipeline/platforms/$plat/package.json"
            publish_if_new "packages/synapse-pipeline/platforms/$plat" "@imunitic/synapse-pipeline-$plat"
          done

          tmp=$(mktemp)
          jq --arg v "$v" '.version = $v | .optionalDependencies |= map_values($v)' \
            packages/synapse/package.json > "$tmp"
          mv "$tmp" packages/synapse/package.json
          publish_if_new "packages/synapse" "@imunitic/synapse"

          tmp=$(mktemp)
          jq --arg v "$v" '.version = $v | .optionalDependencies |= map_values($v)' \
            packages/synapse-pipeline/package.json > "$tmp"
          mv "$tmp" packages/synapse-pipeline/package.json
          publish_if_new "packages/synapse-pipeline" "@imunitic/synapse-pipeline"
