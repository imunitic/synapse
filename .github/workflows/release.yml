name: release

# Every push to main is a release -- no semantic versioning, no manual tag,
# no version-bump decision. See designs/synapse/sb — Convert Synapse into a
# proper Claude Code plugin.md for why: a static or hand-bumped version
# string in plugin.json silently breaks Claude Code's update detection, so
# the only sustainable choice is a version that changes on its own, every
# time, mechanically.
#
# Deliberately independent of tests.yml, which also runs on every push: a
# compile failure here fails this workflow's own build step the same way it
# would there (both run the identical `zig build -Dtarget=...` per release
# target), so there is no real gap in the common case, and chaining this
# workflow behind tests.yml's own success would only add latency to every
# release for a case (compiles fine, fails a unit/bats test) this rolling
# model already accepts as the cost of shipping continuously.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # No version pinned here -- resolved from build.zig.zon's
      # minimum_zig_version, same reasoning as tests.yml.
      - uses: mlugg/setup-zig@v2

      # $(date +%Y-%m)_N, N = the highest N already used this month, plus
      # one. Mechanical, not a judgment call -- see the file header.
      # Underscore before N, not a third hyphen: YYYY-MM-N reads as a
      # truncated date at a glance, YYYY-MM_N doesn't.
      #
      # The highest N, not a count of currently-existing releases -- a
      # count silently goes backwards the moment any release from this
      # month is ever deleted (confirmed live: deleting 2026-08-1 through
      # -8 and keeping only 2026-08_9 made the *next* push compute
      # 2026-08_2, because only one release existed to count). Taking the
      # max instead is monotonic regardless of what got deleted in
      # between. Matches both separators so it still sees earlier
      # hyphen-separated tags from before this format existed.
      - name: Compute the release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prefix="$(date +%Y-%m)"
          max=0
          while read -r n; do
            case "$n" in '' | *[!0-9]*) continue ;; esac
            [ "$n" -gt "$max" ] && max="$n"
          done < <(gh release list --repo "$GITHUB_REPOSITORY" --json tagName -q '.[].tagName' \
            | sed -nE "s/^${prefix}[_-]([0-9]+)\$/\1/p")
          echo "tag=${prefix}_$((max + 1))" >> "$GITHUB_OUTPUT"

      # The one place either plugin.json's version is ever written. Never by
      # hand -- see the design note for why a version that stops changing
      # silently breaks Claude Code's update detection. Both plugins share
      # one tag: they ship from the same push, so there's no meaningful
      # sense in which one could be "newer" than the other.
      - name: Stamp both plugin.json files with the release tag
        run: |
          tmp=$(mktemp)
          jq --arg v "${{ steps.tag.outputs.tag }}" '.version = $v' \
            claude/.claude-plugin/plugin.json > "$tmp"
          mv "$tmp" claude/.claude-plugin/plugin.json
          jq --arg v "${{ steps.tag.outputs.tag }}" '.version = $v' \
            synapse-bard/.claude-plugin/plugin.json > "$tmp"
          mv "$tmp" synapse-bard/.claude-plugin/plugin.json

      - name: Commit the version stamp
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add claude/.claude-plugin/plugin.json synapse-bard/.claude-plugin/plugin.json
          # Nothing to commit is not a failure -- workflow_dispatch on an
          # already-stamped commit, or a re-run, land here.
          git diff --cached --quiet || git commit -m "chore: stamp plugin.json for ${{ steps.tag.outputs.tag }}"
          git push

      # Same targets ci/build-targets.sh verifies compile on every push;
      # this job packages the same builds instead of discarding them. See
      # ci/release-targets.sh for the one shared definition of the list.
      # `zig build` with no step name builds every installed artifact for
      # that target in one invocation -- synapse-bard/synapse-bard-hook
      # included, since build.zig registers them unconditionally -- so
      # bard needs no cross-compile step of its own, one extra tar line
      # per target already being built here is enough. Ships the same
      # platform set as synapse, not narrowed to her own machine's
      # architecture: nothing about the binary depends on which session
      # type downloads it.
      - name: Cross-compile and package each target
        run: |
          source ci/release-targets.sh
          for t in "${targets[@]}"; do
            out="out/$t"
            zig build -Dtarget="$t" -Doptimize=ReleaseSafe -p "$out"
            tar -C "$out/bin" -czf "synapse-$t.tar.gz" synapse synapse-hook
            tar -C "$out/bin" -czf "synapse-bard-$t.tar.gz" synapse-bard synapse-bard-hook
          done

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source ci/release-targets.sh
          assets=()
          for t in "${targets[@]}"; do
            assets+=("synapse-$t.tar.gz" "synapse-bard-$t.tar.gz")
          done
          gh release create "${{ steps.tag.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "${{ steps.tag.outputs.tag }}" \
            --generate-notes \
            "${assets[@]}"

  # Independent of the release job above -- docs aren't tied to a specific
  # release tag, and there's nothing here for the two to coordinate on.
  #
  # One-time manual prerequisite this workflow cannot do for itself: repo
  # Settings -> Pages -> Source: "GitHub Actions". Until that's set, this job
  # runs and uploads an artifact but has nowhere to deploy it.
  #
  # Deploys docs/generate-site.sh's build output, not docs/ itself -- raw
  # markdown uploaded as-is has no landing page and doesn't render.
  pages:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/configure-pages@v5

      # Raw docs/*.md, uploaded as-is, isn't a browsable site -- no rendering,
      # no landing page. docs/generate-site.sh converts every doc to real
      # HTML via pandoc (rewriting the .md cross-links pandoc itself leaves
      # untouched) and turns docs/README.md into index.html.
      - name: Install pandoc
        run: sudo apt-get update -y && sudo apt-get install -y pandoc

      - name: Build the docs site
        run: ./docs/generate-site.sh site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/deploy-pages@v4
        id: deployment
